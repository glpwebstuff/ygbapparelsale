<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Yorktown Girls Basketball Apparel Sale</title>
  <style>
    :root {
      --brand-green: #00482b;
      --brand-dark: #121212;
      --brand-light: #f4f6f5;
      --accent-green: #00874e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--brand-dark); color: #fff; text-align: center; padding: 20px 15px; }
    .container { max-width: 480px; margin: 0 auto; }
    .header { margin-bottom: 20px; }
    .logo-title { font-size: 24px; font-weight: 900; letter-spacing: 1px; color: #fff; text-transform: uppercase; margin-bottom: 4px; }
    .sub-title { font-size: 14px; color: #4caf50; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }
    
    .banner {
      background: linear-gradient(135deg, var(--brand-green), var(--accent-green));
      padding: 12px;
      border-radius: 12px;
      margin-bottom: 20px;
      font-weight: bold;
      font-size: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .cta-btn {
      display: block;
      width: 100%;
      background: #00e676;
      color: #000;
      font-size: 20px;
      font-weight: 900;
      padding: 18px 20px;
      border-radius: 50px;
      text-decoration: none;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
      transition: transform 0.2s;
      margin-bottom: 15px;
    }
    .cta-btn:active { transform: scale(0.98); }

    .help-text { font-size: 12px; color: #aaa; margin-bottom: 25px; line-height: 1.4; }
    .help-text a { color: #fff; text-decoration: underline; }

    .embed-container {
      width: 100%;
      height: 650px;
      border: 2px solid var(--brand-green);
      border-radius: 12px;
      overflow: hidden;
      background: #fff;
    }
    iframe { width: 100%; height: 100%; border: none; }
    
    .footer-note { font-size: 12px; color: #888; margin-top: 25px; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div class="logo-title">Yorktown Basketball</div>
      <div class="sub-title">Official Apparel Sale</div>
    </div>

    <div class="banner">
      ⚡ ONLINE ONLY • SALE ENDS NOV 21, 2026 ⚡
    </div>

    <!-- MAIN ORDER LINK -->
    <a href="https://script.google.com/macros/s/AKfycbxtX0QTCymODCTOGnyycFR7ltRHhr0j4yWypi1jMLhL5tZlRd4ozDP0af6nINlO4x6Yjw/exec" target="_blank" class="cta-btn">
      🛒 ORDER HERE NOW
    </a>

    <p class="help-text">
      Having trouble loading on Instagram? <br>
      <a href="YOUR_GOOGLE_APPS_SCRIPT_URL_HERE" target="_blank">Tap here to open in Chrome or Safari</a>
    </p>

    <!-- EMBEDDED FALLBACK OPTION -->
    <div class="embed-container">
      <iframe src="YOUR_GOOGLE_APPS_SCRIPT_URL_HERE"></iframe>
    </div>

    <div class="footer-note">
      Every purchase supports Yorktown High School Varsity Girls Basketball! 🏀
    </div>
  </div>

</body>
</html>
