<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yorktown Girls Basketball Apparel Sale</title>
  <link rel="preconnect" href="https://script.google.com" />
  <style>
    :root {
      --brand-green: #00482b;
      --brand-dark: #0f1412;
      --accent-green: #00e676;
      --card-bg: #1a231f;
      --text-muted: #a0b0a8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--brand-dark);
      color: #fff;
      text-align: center;
      padding: 20px 15px 40px;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* Styles for the large bold description */
    .order-description {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 20px;
      line-height: 1.4;
      color: #ffffff;
    }

    /* Style for the action button */
    .btn {
      display: inline-block;
      background-color: var(--accent-green);
      color: var(--brand-dark);
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      transition: background-color 0.2s ease;
    }

    .btn:hover {
      background-color: #00c853;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Large Bold Description -->
    <p class="order-description">
      Check out our exclusive apparel collection below and get ready to support Yorktown Girls Basketball!
    </p>

    <!-- Order Here Now Button -->
    <a href="#" class="btn">Order Here Now</a>
  </div>
</body>
</html>
